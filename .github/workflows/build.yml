name: Build

# - push / pull request on main: compile Arcana and the plugins with Java 8 and Java 21, run the smoke test,
#   keep the JARs as a downloadable artifact of the run (Actions tab);
# - release published on GitHub (tag vX.Y.Z): same build, then the JARs and their SHA-256 are attached to the release,
#   and the core library is published to Maven Central (io.github.realburst:arcana);
# - manual run (workflow_dispatch) with a tag: publishes that release to Maven Central (to retry or catch up).
# Maven Central needs the repository secrets GPG_PRIVATE_KEY, CENTRAL_USERNAME and CENTRAL_PASSWORD
# (the same values as for unrar5j: Central Portal user token and the GPG key used to sign).

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      maven_central_tag:
        description: 'Publish this release tag (e.g. v1.0.6) to Maven Central; leave empty for a normal build'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '21' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Check that the Java sources are ASCII only
        run: |
          FILES="$(find src plugins -name '*.java' 2>/dev/null | xargs -r grep -lP '[^\x00-\x7F]' || true)"
          if [ -n "$FILES" ]; then
            echo "$FILES" | while read -r f; do echo "::error file=$f::non-ASCII character in $f"; done
            exit 1
          fi
          echo "All Java sources are ASCII."

      - name: Build Arcana and the plugins
        run: bash build.sh all

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh

      - name: Gather the JARs (Arcana + every plugin) in dist/
        if: matrix.java == '8'
        run: |
          mkdir -p dist
          cp jar/*.jar plugins/*/jar/*.jar dist/
          ls -l dist

      - name: Keep the JARs (Java 8 build only)
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: arcana-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach the JARs to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the tag matches the VERSION file
        run: |
          VERSION="$(head -n 1 VERSION | tr -d ' \t\r\n')"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match the VERSION file (expected 'v$VERSION')"
            exit 1
          fi

      - name: Download the JARs built with Java 8
        uses: actions/download-artifact@v4
        with:
          name: arcana-jars
          path: dist

      - name: Compute the SHA-256 checksums
        run: |
          mkdir -p upload
          find dist -name '*.jar' -exec cp {} upload/ \;
          cd upload
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" upload/* --clobber --repo "${{ github.repository }}"

  maven-central:
    name: Publish to Maven Central
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.maven_central_tag != '')
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release
    steps:
      - name: Checkout the workflow commit (pom.xml)
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.maven_central_tag }}
          path: release

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Check that the tag matches the VERSION file
        id: version
        run: |
          VERSION="$(head -n 1 VERSION | tr -d ' \t\r\n')"
          TAG="${{ github.event.release.tag_name || inputs.maven_central_tag }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match the VERSION file (expected 'v$VERSION')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Arcana
        run: bash build.sh arcana

      - name: Create the JAR, sources JAR, javadoc JAR and POM
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DIR="io/github/realburst/arcana/$VERSION"
          mkdir -p "$DIR"
          cp "jar/Arcana-v$VERSION.jar" "$DIR/arcana-$VERSION.jar"
          jar cf "$DIR/arcana-$VERSION-sources.jar" -C src .
          javadoc -quiet -Xdoclint:none -encoding UTF-8 -sourcepath src -subpackages be.stef.arcana -d javadoc
          test -f javadoc/index.html
          jar cf "$DIR/arcana-$VERSION-javadoc.jar" -C javadoc .
          # pom.xml of the workflow commit: releases made before the POM existed can be published too
          sed "s|\${project.version}|$VERSION|" ../meta/pom.xml > "$DIR/arcana-$VERSION.pom"
          grep -q "<version>$VERSION</version>" "$DIR/arcana-$VERSION.pom"
          ls -l "$DIR"

      - name: Sign, add checksums and make the bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Repository secret GPG_PRIVATE_KEY is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          VERSION="${{ steps.version.outputs.VERSION }}"
          DIR="io/github/realburst/arcana/$VERSION"
          for f in "$DIR"/arcana-"$VERSION".jar "$DIR"/arcana-"$VERSION"-sources.jar "$DIR"/arcana-"$VERSION"-javadoc.jar "$DIR"/arcana-"$VERSION".pom; do
            gpg --batch --yes --pinentry-mode loopback --armor --detach-sign "$f"
            md5sum "$f" | awk '{print $1}' > "$f.md5"
            sha1sum "$f" | awk '{print $1}' > "$f.sha1"
          done
          zip -r bundle.zip io/
          unzip -l bundle.zip

      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ]; then
            echo "::error::Repository secrets CENTRAL_USERNAME / CENTRAL_PASSWORD are missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          TOKEN="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w 0)"
          curl --fail-with-body --request POST --header "Authorization: Bearer $TOKEN" --form bundle=@bundle.zip "https://central.sonatype.com/api/v1/publisher/upload?name=arcana-${{ steps.version.outputs.VERSION }}&publishingType=AUTOMATIC"
          echo
          echo "Uploaded: follow the deployment on https://central.sonatype.com/publishing/deployments"
